<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SentimentAI{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav class="nav"><a class="brand" href="{{ url_for('index') }}">Sentiment<span>AI</span></a>
<div><a href="{{ url_for('index') }}">Analyze</a><a href="{{ url_for('dashboard') }}">Dashboard</a></div></nav>
<main class="container">
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main><footer>AI-Based Sentiment Analyzer · Flask · Hugging Face · MongoDB</footer>
</body></html>
